<!DOCTYPE html>
<html lang="en-GB">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">

<title>Angles practice version 2 (MTH 3-17a)</title>
<style>
  :root {
    --navy: #1F3A5F;
    --teal: #0F8B8D;
    --teal-soft: #E2F1F1;
    --red: #C0001A;
    --red-soft: #FBE7EA;
    --green: #1E7B3C;
    --green-soft: #E3F3E8;
    --paper: #FFFFFF;
    --wash: #EEF3F7;
    --line: #C9D6DF;
    --ink: #1A1A1A;
    --muted: #55606B;
    --head: Cambria, Georgia, "Times New Roman", serif;
    --body: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--body); color: var(--ink); background: var(--wash); font-size: 18px; line-height: 1.45; }
  header { background: var(--navy); color: #fff; padding: 14px 28px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-family: var(--head); font-size: 28px; margin: 0; font-weight: 700; }
  header .code { color: #9BC4C5; font-size: 16px; }
  header button { margin-left: auto; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 24px 48px; }
  h2 { font-family: var(--head); color: var(--navy); font-size: 30px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }

  button { font: inherit; cursor: pointer; border-radius: 10px; border: 2px solid var(--teal); background: var(--teal); color: #fff; padding: 10px 20px; font-weight: 600; }
  button.ghost { background: transparent; color: var(--teal); }
  header button.ghost { color: #fff; border-color: #9BC4C5; }
  button:hover { filter: brightness(1.08); }
  button:focus-visible, input:focus-visible { outline: 3px solid #E07A1F; outline-offset: 2px; }
  button[disabled] { opacity: .45; cursor: default; filter: none; }

  /* home */
  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .set { text-align: left; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 52px 1fr; gap: 4px 12px; align-items: center; font-weight: 400; }
  .set:hover { border-color: var(--teal); filter: none; }
  .set .badge { grid-row: span 2; }
  .set .t { font-weight: 600; line-height: 1.25; }
  .set .s { color: var(--muted); font-size: 15px; }
  .set.done .s { color: var(--green); font-weight: 600; }
  .badge { width: 48px; height: 48px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-family: var(--head); font-size: 24px; font-weight: 700; }

  /* progress */
  .progress { display: flex; gap: 8px; align-items: center; margin: 0 0 18px; flex-wrap: wrap; }
  .pip { min-width: 34px; height: 34px; padding: 0 10px; border-radius: 17px; border: 2px solid var(--line); background: var(--paper); display: grid; place-items: center; font-size: 15px; font-weight: 600; color: var(--muted); }
  .pip.now { border-color: var(--navy); color: var(--navy); }
  .pip.ok { background: var(--green); border-color: var(--green); color: #fff; }
  .pip.miss { background: var(--red); border-color: var(--red); color: #fff; }

  /* stage */
  .stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .figure { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
  .figure img { width: 100%; height: auto; display: block; }
  .panel { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 20px; }
  .panel h3 { margin: 0 0 12px; font-family: var(--head); color: var(--navy); font-size: 22px; }

  ol.steps { margin: 0 0 18px; padding-left: 26px; }
  ol.steps li { margin-bottom: 12px; }
  ol.steps li.final { color: var(--red); font-weight: 700; }
  ol.steps li.hidden { display: none; }

  .answers { display: grid; gap: 12px; margin-bottom: 18px; }
  .ans { display: flex; align-items: center; gap: 10px; font-size: 24px; }
  .ans label { font-family: var(--head); font-style: italic; min-width: 2.2em; }
  .ans input { font: inherit; width: 4.2em; padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; text-align: center; }
  .ans input.right { border-color: var(--green); background: var(--green-soft); }
  .ans input.wrong { border-color: var(--red); background: var(--red-soft); }
  .ans input.shown { border-color: var(--teal); background: var(--teal-soft); color: var(--navy); font-weight: 700; }
  .ans .mark { font-size: 22px; width: 1.2em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }

  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; display: none; }
  .feedback.show { display: block; }
  .feedback.good { background: var(--green-soft); color: var(--green); }
  .feedback.bad { background: var(--red-soft); color: var(--red); }
  .feedback.reveal { background: var(--teal-soft); color: var(--navy); }
  .feedback strong { font-size: 22px; display: block; }
  .work { margin-top: 6px; color: var(--ink); }

  .peek { margin-top: 18px; }
  .peek summary { cursor: pointer; color: var(--teal); font-weight: 600; }
  .peek img { width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }
  .peek ol { font-size: 16px; }

  .end { text-align: center; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 36px 20px; }
  .end .big { font-family: var(--head); font-size: 64px; color: var(--navy); line-height: 1; margin: 10px 0; }
  .end .row { justify-content: center; margin-top: 20px; }

  @media (max-width: 760px) {
    .stage { grid-template-columns: 1fr; }
    main { padding: 16px 12px 40px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .feedback.show { animation: pop .18s ease-out; }
    @keyframes pop { from { transform: scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
  }
</style>
</head>

  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const k of kids) if (k !== null && k !== undefined) e.append(k);
  return e;
}

function home() {
  S = null;
  homeBtn.hidden = true;
  app.replaceChildren(
    el('h2', {}, 'Choose a set'),
    el('p', { class: 'sub' }, 'Each set starts with a worked example, then 5 questions. Type your answers and press Check.'),
    el('div', { class: 'sets' }, ...DATA.map((t, i) => {
      const done = results[i] !== undefined;
      return el('button', { class: 'set' + (done ? ' done' : ''), onclick: () => startSet(i) },
        el('span', { class: 'badge' }, t.letter),
        el('span', { class: 't' }, t.title),
        el('span', { class: 's' }, done ? `${results[i]} out of 5 first time` : '5 questions'));
    }))
  );
  window.scrollTo(0, 0);
}

function progress() {
  const t = DATA[S.set];
  const pips = [el('span', { class: 'pip' + (S.q < 0 ? ' now' : ' ok') }, 'Example')];
  t.items.forEach((_, i) => {
    let c = 'pip';
    if (S.marks[i] === true) c += ' ok';
    else if (S.marks[i] === false) c += ' miss';
    else if (S.q === i) c += ' now';
    pips.push(el('span', { class: c, title: 'Question ' + (i + 1) }, String(i + 1)));
  });
  return el('div', { class: 'progress', 'aria-label': 'Progress' }, ...pips);
}

function startSet(i) {
  S = { set: i, q: -1, marks: [], step: 0 };
  homeBtn.hidden = false;
  showExample();
}

function header() {
  const t = DATA[S.set];
  return [el('h2', {}, `Set ${t.letter}: ${t.title}`), progress()];
}

function showExample() {
  const t = DATA[S.set];
  const steps = t.ex.steps;
  const img = el('img', { src: t.ex.q, alt: 'Worked example diagram' });
  const list = el('ol', { class: 'steps' }, ...steps.map((s, i) =>
    el('li', { class: (i === steps.length - 1 ? 'final ' : '') + (i > 0 ? 'hidden' : '') }, s)));
  let shown = 1;
  const next = el('button', {}, 'Show next step');
  const go = el('button', { class: steps.length > 1 ? 'ghost' : '' }, 'Start the questions');
  next.onclick = () => {
    list.children[shown].classList.remove('hidden');
    shown++;
    if (shown === steps.length) { next.hidden = true; go.className = ''; img.src = t.ex.a; go.focus(); }
  };
  if (steps.length === 1) { next.hidden = true; img.src = t.ex.a; }
  go.onclick = () => { S.q = 0; showQuestion(); };
  app.replaceChildren(...header(),
    el('div', { class: 'stage' },
      el('div', { class: 'figure' }, img),
      el('div', { class: 'panel' }, el('h3', {}, 'Worked example'), list, el('div', { class: 'row' }, next, go))));
  next.focus();
  window.scrollTo(0, 0);
}

function showQuestion() {
  const t = DATA[S.set];
  const it = t.items[S.q];
  let tries = 0;
  const img = el('img', { src: it.q, alt: `Question ${S.q + 1} diagram` });
  const rows = it.answers.map(([letter, val]) => {
    const id = `in-${letter}`;
    const input = el('input', { id, type: 'text', inputmode: 'numeric', autocomplete: 'off', 'aria-label': `${letter} in degrees` });
    const mark = el('span', { class: 'mark', 'aria-hidden': 'true' });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!e.repeat) check.click(); } });
    return { letter, val, input, mark, row: el('div', { class: 'ans' }, el('label', { for: id }, letter + ' ='), input, el('span', {}, '°'), mark) };
  });
  const fb = el('div', { class: 'feedback', role: 'status', 'aria-live': 'polite' });
  const check = el('button', {}, 'Check');
  const nextBtn = el('button', { hidden: '' }, S.q === 4 ? 'See my score' : 'Next question');
  nextBtn.onclick = () => { if (S.q === 4) showEnd(); else { S.q++; showQuestion(); } };

  function finish(firstTime, revealed) {
    S.marks[S.q] = firstTime;
    rows.forEach(r => { r.input.readOnly = true; });
    check.hidden = true; nextBtn.hidden = false;
    img.src = it.a; img.alt = `Question ${S.q + 1} with answers`;
    const prog = app.querySelector('.progress'); prog.replaceWith(progress());
    setTimeout(() => nextBtn.focus(), 150);
  }

  check.onclick = () => {
    const blank = rows.filter(r => r.input.value.trim() === '' && !r.input.readOnly);
    if (blank.length) {
      fb.className = 'feedback show bad';
      fb.replaceChildren(el('strong', {}, 'Fill in every box first'), `Type a number for ${blank.map(r => r.letter).join(' and ')}.`);
      blank[0].input.focus(); return;
    }
    tries++;
    let allRight = true;
    rows.forEach(r => {
      const n = parseFloat(r.input.value.replace(/[^0-9.\-]/g, ''));
      const ok = n === r.val;
      r.input.classList.toggle('right', ok); r.input.classList.toggle('wrong', !ok);
      r.mark.textContent = ok ? '✓' : '✗'; r.mark.style.color = ok ? 'var(--green)' : 'var(--red)';
      if (ok) r.input.readOnly = true; else allRight = false;
    });
    const work = it.work ? el('div', { class: 'work' }, 'Working: ' + it.work) : null;
    if (allRight) {
      fb.className = 'feedback show good';
      fb.replaceChildren(el('strong', {}, tries === 1 ? 'Correct!' : 'Correct this time!'), work);
      finish(tries === 1);
    } else if (tries < 2) {
      fb.className = 'feedback show bad';
      const wrong = rows.filter(r => !r.input.readOnly);
      fb.replaceChildren(el('strong', {}, 'Not quite'),
        `Have another look at ${wrong.map(r => r.letter).join(' and ')}, then press Check again. The worked example is below if you need it.`);
      wrong[0].input.select();
    } else {
      rows.forEach(r => { if (!r.input.readOnly) { r.input.value = r.val; r.input.className = 'shown'; r.mark.textContent = ''; } });
      fb.className = 'feedback show reveal';
      fb.replaceChildren(el('strong', {}, 'Here are the answers'),
        rows.map(r => `${r.letter} = ${r.val}°`).join(',  '), work);
      finish(false, true);
    }
  };

  const peek = el('details', { class: 'peek' },
    el('summary', {}, 'Look at the worked example again'),
    el('img', { src: t.ex.a, alt: 'Worked example with answer' }),
    el('ol', {}, ...t.ex.steps.map(s => el('li', {}, s))));

  app.replaceChildren(...header(),
    el('div', { class: 'stage' },
      el('div', { class: 'figure' }, img),
      el('div', { class: 'panel' },
        el('h3', {}, `Question ${S.q + 1}`),
        el('p', { class: 'sub' }, 'Work out the size of each angle marked with a letter.'),
        el('div', { class: 'answers' }, ...rows.map(r => r.row)),
        el('div', { class: 'row' }, check, nextBtn), fb, peek)));
  rows[0].input.focus();
  window.scrollTo(0, 0);
}

function showEnd() {
  const t = DATA[S.set];
  const score = S.marks.filter(m => m === true).length;
  results[S.set] = score;
  S.q = 5;
  const msg = score === 5 ? 'Brilliant, all correct first time.' : score >= 3 ? 'Well done. Look back at any you missed.' : 'Good effort. Try the set again to practise.';
  const again = el('button', { class: 'ghost', onclick: () => startSet(S.set) }, 'Try this set again');
  const kids = [again];
  if (S.set < DATA.length - 1) kids.push(el('button', { onclick: () => startSet(S.set + 1) }, `Go to Set ${DATA[S.set + 1].letter}`));
  kids.push(el('button', { class: 'ghost', onclick: home }, 'Choose another set'));
  app.replaceChildren(...header(),
    el('div', { class: 'end' },
      el('p', {}, `Set ${t.letter} finished`),
      el('div', { class: 'big' }, `${score} out of 5`),
      el('p', {}, 'right first time. ' + msg),
      el('div', { class: 'row' }, ...kids)));
  kids[kids.length > 2 ? 1 : 0].focus();
}

home();
</script>
