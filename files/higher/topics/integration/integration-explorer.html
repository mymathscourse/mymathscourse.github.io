<!doctype html>
<html lang="en-GB">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integration explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2733; --muted: #5b6977; --paper: #f4f6f8; --panel: #ffffff; --line: #d8dfe6;
    --accent: #2d6a8f; --accent-soft: #e3eef5; --btn: #ffffff; --on: #1b2733; --on-text: #ffffff;
    --f: #2d70b3; --d: #6042a6; --tan: #7a7a7a; --hi: #e07a00; --sp: #c2185b;
    --up: #2b7a3a; --down: #b83c38; --flat: #5b6977;
    --up-bg: #e3f2e6; --down-bg: #f8e3e2; --flat-bg: #eceff2;
    --answer-bg: #fff8dc; --answer-line: #e3c766;
    --grid: #e9ecf0; --axis: #5b6573; --band: rgba(45, 106, 143, .08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e4ebf1; --muted: #9fadba; --paper: #121a21; --panel: #1a242d; --line: #2f3d49;
      --accent: #7fb6d8; --accent-soft: #1f3342; --btn: #1d2731; --on: #e4ebf1; --on-text: #121a21;
      --f: #6fa8e0; --d: #b39ce8; --tan: #9aa5b0; --hi: #ffa64d; --sp: #f06292;
      --up: #7fd08d; --down: #f0918d; --flat: #b3bfcb;
      --up-bg: #1b3322; --down-bg: #3a1f1e; --flat-bg: #232d37;
      --answer-bg: #2f2a14; --answer-line: #8a7630;
      --grid: #24303b; --axis: #8d9aa7; --band: rgba(127, 182, 216, .1);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 12px 16px 32px; }
  .back { color: var(--accent); font-size: 15px; }
  h1 { font-size: 1.5rem; margin: 4px 0 10px; }
  .keys { font-size: 13px; color: var(--muted); margin-left: auto; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  .tabs button {
    font: inherit; font-size: 15px; padding: 7px 12px; border-radius: 8px 8px 0 0; border: 1px solid var(--line);
    border-bottom: 3px solid var(--line); background: var(--btn); color: var(--muted); cursor: pointer;
  }
  .tabs button[aria-selected=true] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
  .tabs button .k { font-size: 12px; opacity: .7; margin-right: 4px; }
  .tabs button.new::after { content: "new"; font-size: 11px; font-weight: 700; color: var(--sp); margin-left: 5px; vertical-align: 1px; }
  .seq { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 10px; }
  button.btn, select, input.n {
    font: inherit; font-size: 15px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--btn); color: var(--ink);
  }
  button.btn, select { cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #121a21; } }
  button[aria-pressed=true] { background: var(--on); color: var(--on-text); border-color: var(--on); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input.n { width: 4.6em; text-align: center; padding: 5px 4px; font-size: 17px; }
  input.n.w { width: 16em; text-align: left; padding: 5px 8px; }
  input.n.bad { border-color: var(--down); outline: 2px solid var(--down); }
  .eqin { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 19px; }
  .err { color: var(--down); font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); }

  .cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 12px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  svg.g { width: 100%; height: auto; display: block; touch-action: none; cursor: ew-resize; }
  svg.g + svg.g { border-top: 2px solid var(--line); margin-top: 4px; }
  .glab { font-size: 13px; color: var(--muted); margin: 2px 0; }
  .mover { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; font-size: 15px; }
  .mover input[type=range] { width: min(260px, 40vw); accent-color: var(--accent); vertical-align: middle; }
  .status b { padding: 1px 7px; border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .legend span::before {
    content: ""; display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px;
    vertical-align: middle; background: var(--c);
  }
  .checks label { font-size: 14px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }

  /* working */
  .stepbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .stepbar .btn { font-size: 14px; padding: 5px 10px; }
  .step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .step .num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  @media (prefers-color-scheme: dark) { .step .num { color: #121a21; } }
  .step .st { font-weight: 700; margin-bottom: 2px; }
  .step.hid { cursor: pointer; }
  .step.hid .num { background: var(--line); color: var(--muted); }
  .step.hid .st { color: var(--muted); font-weight: 400; }
  .step.hid .st::after { content: " – click to reveal"; font-size: 13px; }
  .mm { font-family: "Cambria Math", "STIX Two Math", "Times New Roman", Times, serif; font-size: 20px; line-height: 1.7; }
  .mm i, .eqin i { font-style: italic; }
  .why { font-size: 14px; color: var(--muted); margin: 2px 0 4px; }
  .answer { margin-top: 6px; padding: 8px 12px; border-radius: 6px; background: var(--answer-bg); border: 1px solid var(--answer-line); }
  .tag { padding: 1px 7px; border-radius: 4px; font-family: "Atkinson Hyperlegible", system-ui, sans-serif; font-size: 15px; }
  .up { color: var(--up); background: var(--up-bg); }
  .down { color: var(--down); background: var(--down-bg); }
  .flat { color: var(--flat); background: var(--flat-bg); }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.1; margin: 0 2px; }
  .fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
  sup .fr { font-size: .75em; }
  sup { font-size: .7em; }
  .ov { border-top: 1.5px solid currentColor; padding: 0 1px; }

  table.nt { border-collapse: collapse; margin: 6px 0; font-size: 18px; }
  table.nt th, table.nt td { border: 1px solid var(--line); padding: 3px 9px; text-align: center; min-width: 40px; }
  table.nt th:first-child, table.nt td:first-child { text-align: left; background: var(--paper); }
  table.nt td.p { color: var(--up); font-weight: 700; } table.nt td.m { color: var(--down); font-weight: 700; }
  table.nt td.root, table.nt th.root { background: var(--flat-bg); }
  svg.sl { width: 30px; height: 20px; vertical-align: middle; }
  svg.sl line { stroke-width: 3; stroke-linecap: round; }
  .nl { width: 100%; height: auto; margin-top: 8px; display: block; }
  .nl text { font-family: inherit; font-size: 15px; fill: var(--ink); }

  /* graph svg */
  svg .gl { stroke: var(--grid); stroke-width: 1; }
  svg .ax { stroke: var(--axis); stroke-width: 1.6; }
  svg .tk { font-size: 13px; fill: var(--muted); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
  svg .cf { stroke: var(--f); stroke-width: 3.5; fill: none; }
  svg .cfaint { stroke: var(--f); stroke-width: 2.5; fill: none; opacity: .3; }
  svg .cd { stroke: var(--d); stroke-width: 3.5; fill: none; }
  svg .cg { stroke: var(--up); stroke-width: 3; fill: none; }
  svg .cup { stroke: var(--up); stroke-width: 5; fill: none; }
  svg .cdown { stroke: var(--down); stroke-width: 5; fill: none; }
  svg .ct { stroke: var(--tan); stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
  svg .cl { stroke: var(--hi); stroke-width: 2.5; fill: none; }
  svg .cline { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 3 5; fill: none; }
  svg .vl { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 5; }
  svg .fup { fill: var(--up); opacity: .18; } svg .fdown { fill: var(--down); opacity: .18; }
  svg .band { fill: var(--band); }
  svg .pt { fill: var(--ink); }
  svg .pf { fill: var(--f); stroke: var(--panel); stroke-width: 2; }
  svg .pd { fill: var(--down); stroke: var(--panel); stroke-width: 2; }
  svg .ptr { fill: var(--down); }
  svg .psp { fill: var(--sp); stroke: var(--panel); stroke-width: 2; }
  svg .phi { fill: var(--hi); stroke: var(--panel); stroke-width: 2; }
  svg .pup { fill: var(--up); stroke: var(--panel); stroke-width: 2; }
  svg .pdn { fill: var(--down); stroke: var(--panel); stroke-width: 2; }
  svg .pop { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; }
  svg .lab {
    font-size: 15px; font-weight: 700; paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round;
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif; fill: var(--ink);
  }
  svg .lab.f { fill: var(--f); } svg .lab.d { fill: var(--d); } svg .lab.r { fill: var(--down); }
  svg .lab.sp { fill: var(--sp); } svg .lab.hi { fill: var(--hi); } svg .lab.u { fill: var(--up); }
  svg .arrow { fill: var(--f); }


  .intg { font-size: 1.45em; vertical-align: -0.18em; margin-right: 1px; }
  .lims { display: inline-flex; flex-direction: column; justify-content: space-between; font-size: .58em; line-height: 1.3; vertical-align: middle; margin-right: 3px; }
  .sqb { font-size: 1.3em; vertical-align: -0.08em; }
  .ctx { font-size: 15px; color: var(--ink); }
  .checks.mover { margin-top: 8px; }
  svg .strip { fill: var(--up); fill-opacity: .22; stroke: var(--up); stroke-width: 1; }
  svg .strip.neg { fill: var(--down); stroke: var(--down); }
  svg .fbet { fill: var(--up); opacity: .22; }
  svg .fup, svg .fdown { opacity: .28; }
  /* practice questions */
  .practice { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 14px; }
  .phead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .phead h2 { font-size: 1.15rem; margin: 0 auto 0 0; }
  .plist { list-style: none; margin: 10px 0 0; padding: 0; counter-reset: pq; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 10px; align-items: start; }
  .plist > li { counter-increment: pq; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; }
  .pq { font-size: 17px; line-height: 1.6; margin-bottom: 8px; }
  .pq::before { content: counter(pq) ". "; font-weight: 700; }
  .pq .mm { font-size: 19px; }
  .psol { font-size: 14px !important; padding: 5px 10px !important; }
  .pws { margin-top: 6px; }
  .psvg svg.g { max-width: 520px; cursor: default; }
  @media (max-width: 960px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../../index.html#integration">← Back to hub</a>
    <span class="keys">Keys: 1–9, 0 switch tab · W next step · B back a step · P play · N next example</span>
  </div>
  <h1>Integration explorer</h1>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <p class="seq" id="seq"></p>
  <div id="panes"></div>
</div>

<script>
(function () {
'use strict';

// ===================== Fractions and formatting =====================
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => a / gcd(a, b) * b;
function fr(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; }
const fadd = (x, y) => fr(x.n * y.d + y.n * x.d, x.d * y.d);
const fsub = (x, y) => fr(x.n * y.d - y.n * x.d, x.d * y.d);
const fmul = (x, y) => fr(x.n * y.n, x.d * y.d);
const fdiv = (x, y) => fr(x.n * y.d, x.d * y.n);
const fneg = x => fr(-x.n, x.d);
const fval = x => x.n / x.d;
const isZ = x => x.n === 0;
const isOne = x => x.n === 1 && x.d === 1;
const fabs = x => fr(Math.abs(x.n), x.d);

const fmtInt = v => (v < 0 ? '−' : '') + Math.abs(v);
const fracText = f => fmtInt(f.n) + (f.d > 1 ? '/' + f.d : '');
const stack = (n, d) => '<span class="fr"><span>' + n + '</span><span>' + d + '</span></span>';
const fracH = f => f.d === 1 ? fmtInt(f.n) : (f.n < 0 ? '−' : '') + stack(Math.abs(f.n), f.d);
function fmt(v, dp = 3) {
  if (!isFinite(v)) return '–';
  const r = Math.round(v * 10 ** dp) / 10 ** dp;
  return (r < 0 ? '−' : '') + String(Math.abs(r));
}
const X = '<i>x</i>';
const sup = p => {
  if (typeof p === 'number') p = fr(p);
  return '<sup>' + (p.n < 0 ? '−' : '') + (p.d === 1 ? Math.abs(p.n) : stack(Math.abs(p.n), p.d)) + '</sup>';
};
const ov = s => '<span class="ov">' + s + '</span>';
const sqrtH = s => '√' + ov(s);
const signed = (f, first) => first ? fracH(f) : (f.n < 0 ? ' − ' : ' + ') + fracH(fabs(f));
// coefficient in front of something: 1 → '', −1 → '−'
const coefH = c => isOne(c) ? '' : (c.n === -1 && c.d === 1) ? '−' : fracH(c);

function parseNum(s) {
  s = String(s).replace(/[−–]/g, '-').replace(/\s+/g, '');
  if (s === '' || s === '+') return fr(0);
  const m = s.match(/^([+-]?)(\d*\.?\d+)(?:\/(\d*\.?\d+))?$/);
  if (!m) return null;
  const dec = t => { const k = (t.split('.')[1] || '').length; return fr(Math.round(parseFloat(t) * 10 ** k), 10 ** k); };
  let f = dec(m[2]);
  if (m[1] === '-') f = fneg(f);
  if (m[3]) { const q = dec(m[3]); if (q.n === 0) return null; f = fdiv(f, q); }
  return f;
}
// A number that may be a multiple of π: { f, pi }
function parseAngle(s) {
  s = String(s).replace(/[−–]/g, '-').replace(/\s+/g, '').replace(/pi/gi, 'π');
  const m = s.match(/^([+-]?)(\d*)π(?:\/(\d+))?$/);
  if (m) {
    let f = fr(m[2] ? Number(m[2]) : 1, m[3] ? Number(m[3]) : 1);
    if (m[1] === '-') f = fneg(f);
    return { f, pi: true };
  }
  const f = parseNum(s);
  return f ? { f, pi: false } : null;
}
const angVal = A => fval(A.f) * (A.pi ? Math.PI : 1);
function angH(A) {
  if (!A.pi) return fracH(A.f);
  if (isZ(A.f)) return '0';
  const n = Math.abs(A.f.n), top = (n === 1 ? '' : n) + 'π';
  return (A.f.n < 0 ? '−' : '') + (A.f.d === 1 ? top : stack(top, A.f.d));
}
const angText = A => !A.pi ? fracText(A.f) : (A.f.n < 0 ? '−' : '') + (Math.abs(A.f.n) === 1 ? '' : Math.abs(A.f.n)) + 'π' + (A.f.d > 1 ? '/' + A.f.d : '');

// ===================== Terms: c·x^p, c·sin(bx), c·cos(bx) =====================
function powR(x, p) { // real power, handling odd roots of negatives
  if (x < 0) { if (p.d % 2 === 0) return NaN; return (p.n % 2 ? -1 : 1) * Math.abs(x) ** fval(p); }
  return x ** fval(p);
}
function evalTerm(t, x) {
  if (t.t === 'pow') return fval(t.c) * (t.p.n === 0 ? 1 : powR(x, t.p));
  const v = fval(t.b) * x;
  return fval(t.c) * (t.t === 'sin' ? Math.sin(v) : Math.cos(v));
}
const evalTerms = (ts, x) => ts.reduce((s, t) => s + evalTerm(t, x), 0);
function dTerm(t) {
  if (t.t === 'pow') return t.p.n === 0 ? null : { t: 'pow', c: fmul(t.c, t.p), p: fsub(t.p, fr(1)) };
  if (t.t === 'sin') return { t: 'cos', c: fmul(t.c, t.b), b: t.b };
  return { t: 'sin', c: fneg(fmul(t.c, t.b)), b: t.b };
}
const dTerms = ts => ts.map(dTerm).filter(t => t && !isZ(t.c));

function powBody(q, xv, xb) { // x^q (q > 0) in tidy form
  if (q.d === 1) return xv + (q.n === 1 ? '' : sup(q));
  if (q.d === 2 && q.n === 1) return sqrtH(xb);
  if (q.d === 3 && q.n === 1) return '∛' + ov(xb);
  if (q.d === 3 && q.n === 2) return '∛' + ov(xv + '<sup>2</sup>');
  return xv + sup(q);
}
// style: 'index' (x^-2, x^1/2) or 'nice' (1/x², √x). sub: html of a value replacing x.
function termParts(t, style, sub) {
  const xv = sub ? '(' + sub + ')' : X, xb = sub || X;
  const neg = t.c.n < 0, m = fabs(t.c), cs = isOne(m) ? '' : fracH(m);
  if (t.t !== 'pow') {
    const bx = isOne(t.b) ? (sub || X) : fracH(t.b) + xv;
    return { neg, body: cs + t.t + (sub ? '(' + bx + ')' : ' ' + bx) };
  }
  const p = t.p;
  if (p.n === 0) return { neg, body: fracH(m) };
  if (style === 'nice' && p.n < 0) {
    const q = fr(-p.n, p.d);
    return { neg, body: stack(m.n, (m.d === 1 ? '' : m.d) + powBody(q, xv, xb)) };
  }
  if (style === 'nice') return { neg, body: cs + powBody(p, xv, xb) };
  return { neg, body: cs + xv + (isOne(p) ? '' : sup(p)) };
}
function sumH(ts, style = 'index', sub = null) {
  let out = '';
  ts.filter(t => !isZ(t.c)).forEach(t => {
    const { neg, body } = termParts(t, style, sub);
    out += out === '' ? (neg ? '−' : '') + body : (neg ? ' − ' : ' + ') + body;
  });
  return out || '0';
}
// the "multiply by the power" line: 6 × ½x^−½
function rawDiffH(ts) {
  let out = '';
  ts.forEach(t => {
    let piece;
    if (t.t === 'pow') {
      if (t.p.n === 0) return;
      const np = fsub(t.p, fr(1));
      piece = fracH(fabs(t.c)) + ' × ' + (t.p.n < 0 ? '(' + fracH(t.p) + ')' : fracH(t.p)) + (np.n === 0 ? '' : X + (isOne(np) ? '' : sup(np)));
    } else {
      const bx = (isOne(t.b) ? '' : fracH(t.b)) + X;
      piece = fracH(fabs(t.c)) + ' × ' + fracH(t.b) + (t.t === 'sin' ? ' cos ' : ' × (−sin ') + bx + (t.t === 'sin' ? '' : ')');
    }
    const neg = t.c.n < 0;
    out += out === '' ? (neg ? '−' : '') + piece : (neg ? ' − ' : ' + ') + piece;
  });
  return out || '0';
}

// exact real power of a fraction, or null
function exactPow(a, p) {
  if (a.n === 0) return p.n > 0 ? fr(0) : p.n === 0 ? fr(1) : null;
  const rt = (v, k) => {
    if (v < 0) { if (k % 2 === 0) return null; const r = rt(-v, k); return r === null ? null : -r; }
    const r = Math.round(v ** (1 / k)); return r ** k === v ? r : null;
  };
  const nr = rt(a.n, p.d), dr = rt(a.d, p.d);
  if (nr === null || dr === null) return null;
  const e = Math.abs(p.n), num = nr ** e, den = dr ** e;
  if (!Number.isSafeInteger(num) || !Number.isSafeInteger(den)) return null;
  return p.n >= 0 ? fr(num, den) : fr(den, num);
}
// exact sin(qπ): {c: frac, s: 1|2|3} meaning c√s, or null
function exactSin(q) {
  const k12 = q.n * 12 / q.d;
  if (!Number.isInteger(k12)) return null;
  const k = ((k12 % 24) + 24) % 24, deg = k * 15;
  let ref = deg % 180; if (ref > 90) ref = 180 - ref;
