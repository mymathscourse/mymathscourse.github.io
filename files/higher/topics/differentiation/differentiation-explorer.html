<style>

  * { box-sizing: border-box; }

<script>
(function () {

}
const X = '<i>x</i>';
const sup = p => {

};
const ov = s => '<span class="ov">' + s + '</span>';

const coefH = c => isOne(c) ? '' : (c.n === -1 && c.d === 1) ? '−' : fracH(c);

function parseNum(s) {

  if (s === '' || s === '+') return fr(0);

}

      out.push({ title: 'Differentiate', html: '<div class="mm"><i>y</i> = ' + polyH(co) + '<br>' + dydx + ' = ' + polyH(dco) + '</div>' });
      out.push({ title: 'Set the derivative equal to the gradient', html: '<div class="mm">' + polyH(dco) + ' = ' + fracH(m) + '</div>' });
      out.push({ title: 'Solve', html: linesH(S.L, S.why) });
      out.push({ title: 'Find the points', html: pts.length ? '<div class="mm">' + pts.map(p => X + ' = ' + p.r.html + ': <i>y</i> = ' + (p.yF ? polyH(co, p.r.html) + ' = ' + fracH(p.yF) : '≈ ' + fmt(p.y, 2))).join('<br>') + '</div>' +
        ansBox((pts.length > 1 ? 'The points are ' : 'The point is ') + pts.map(p => '(' + (p.r.rat ? p.r.text : fmt(p.x, 2)) + ', ' + (p.yF ? fracText(p.yF) : fmt(p.y, 2)) + ')').join(' and ') + '.') :
        ansBox('No point on the curve has this gradient.') });
      const f = x => peval(co, x);
      G = { f, m: fval(m), steps: out, sols: pts.map(p => [p.x, p.y, '(' + (p.r.rat ? p.r.text : fmt(p.x, 2)) + ', ' + (p.yF ? fracText(p.yF) : fmt(p.y, 2)) + ')']),
        line: line ? { c: line.c } : null, v: polyView(co, pts.map(p => p.x), pts.map(p => p.y)) };
      st.set(out); draw();
    }
    function load() {
      ob.hidden = sel.value !== 'own'; st.reset(1);
      if (sel.value === 'own') { I.load(0); return; }
      const g = GIV[sel.value];
      if (g.kind === 'poly') setPoly(g.co.split(',').map(parseNum).filter((c, i, a) => i > 0 || !isZ(c)), parseNum(g.m), g.line || null);
      else { const h = HAND[g.id]; G = { f: x => evalTerms(h.ts, x), m: h.m, steps: h.steps, sols: h.sols, v: h.v, trig: h.trig }; st.set(h.steps); draw(); }
    }
    function draw() {
      if (!G) return;
      const n = st.n, last = G.steps.length;
      P.begin(G.v, { trig: G.trig ? 'rad' : null });
      if (G.line) P.through(0, G.line.c, G.m, 'cline');
      P.curve(G.f, 'cf', G.v.x0, G.v.x1, 900);
      if (n >= last) G.sols.forEach(([x, y, l]) => { P.through(x, y, G.m, 'cl'); P.dot(x, y, 'phi', 7); if (l) P.label(x, y, l, 'hi'); });
      else if (n >= last - 1) G.sols.forEach(([x]) => P.vline(x));
      P.end();
    }
    sel.addEventListener('change', load);
    load();
    return { next: () => { sel.value = sel.value === 'own' ? 0 : (Number(sel.value) + 1) % GIV.length; load(); }, st };
  }
});

TABS.push({
  id: 'derived', name: 'The derived graph', isNew: true, seq: 'Steps 9.1–9.3: sketch f′ from f, and read the stationary points of f from f′.',

      DV = { x0: V.x0, x1: V.x1, y0: lo - pad, y1: hi + pad };

        const iv = i => !rs.length ? 'all ' + X : i === 0 ? X + ' &lt; ' + rs[0].html : i === rs.length ? X + ' &gt; ' + rs[rs.length - 1].html : rs[i - 1].html + ' &lt; ' + X + ' &lt; ' + rs[i].html;

        if (n >= 4) { p2.through(a, f(a), df(a), 'ct'); p2.dot(a, f(a), 'pt', 6); }
