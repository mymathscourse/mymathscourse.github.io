<script>
// ===================== Shared helpers (no page code here, so test.js can load it) =====================
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const nz = (a, b) => { let v = 0; while (!v) v = ri(a, b); return v; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const MINUS = '−';
const clean = x => parseFloat(Number(x).toFixed(10));
// a number with a proper minus sign (no float noise)
const N = x => { x = clean(x); return (x < 0 ? MINUS : '') + String(Math.abs(x)); };
// fixed decimal places, trailing zeros kept
const fx = (x, d = 2) => { const s = Math.abs(x).toFixed(d); return (x < 0 && Number(s) !== 0 ? MINUS : '') + s; };
// rounded to d decimal places, trailing zeros dropped
const rd = (x, d = 2) => N(Math.round(x * 10 ** d) / 10 ** d);
// n significant figures, trailing zeros kept (e.g. 2.50)
const sf = (x, n = 3) => {
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x))), d = Math.max(0, n - 1 - e);
  const r = Number(x.toPrecision(n));
  return (r < 0 ? MINUS : '') + Math.abs(r).toFixed(d);
};
// money
const gbp = x => { const r = Math.round(Math.abs(x) * 100) / 100; return '£' + (Number.isInteger(r) ? String(r) : r.toFixed(2)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
const big = x => N(x).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// ---------- maths html ----------
const mm = h => '<span class="mm">' + h + '</span>';
const V = s => '<i>' + s + '</i>';
const X = V('x'), Y = V('y');
const sup = s => '<sup>' + s + '</sup>';
const fr = (t, b) => '<span class="fr"><span>' + t + '</span><span>' + b + '</span></span>';
const rt = s => '√<span class="ov">' + s + '</span>';
const hl = s => '<span class="hl">' + s + '</span>';
const hb = s => '<span class="hb">' + s + '</span>';
const deg = '°';
const pw = (v, p) => p === 0 ? '' : p === 1 ? v : v + sup(p);
// one term c·v, as the first term (sign only if negative) or with " + " / " − " in front
function tm(c, v = '', first = false) {
  if (!c) return '';
  const a = Math.abs(c), body = (a === 1 && v ? '' : N(a)) + v;
  if (first) return (c < 0 ? MINUS : '') + body;
  return (c < 0 ? ' − ' : ' + ') + body;
}
// [[c, v], ...] as an expression, skipping zero terms
function ex(terms) {
  let s = '', first = true;
  for (const [c, v] of terms) { if (!c) continue; s += tm(c, v, first); first = false; }
  return s || '0';
}
// ax + b style helpers
const lin = (a, b, v = X) => ex([[a, v], [b, '']]);
const quad = (a, b, c, v = X) => ex([[a, pw(v, 2)], [b, v], [c, '']]);
// (x + a)
const br = (a, b, v = X) => '(' + lin(a, b, v) + ')';
// signed number for substitution: wraps negatives in brackets
const sb = x => x < 0 ? '(' + N(x) + ')' : N(x);
// " + 3" / " − 3"
const pm = x => (x < 0 ? ' − ' : ' + ') + N(Math.abs(x));
const vec = (...c) => '<span class="vec"><b>(</b><span>' + c.map(v => '<span>' + v + '</span>').join('') + '</span><b>)</b></span>';
const bold = s => '<b>' + s + '</b>';
const arrow = s => '<span style="display:inline-block;position:relative">' + s + '<span style="position:absolute;left:0;right:0;top:-.55em;text-align:center;font-size:.8em">→</span></span>';

// ---------- exact fractions ----------
const Q = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
const qadd = (a, b) => Q(a.n * b.d + b.n * a.d, a.d * b.d);
const qsub = (a, b) => Q(a.n * b.d - b.n * a.d, a.d * b.d);
const qmul = (a, b) => Q(a.n * b.n, a.d * b.d);
const qdiv = (a, b) => Q(a.n * b.d, a.d * b.n);
const qv = q => q.n / q.d;
// html; mixed = true writes improper fractions as mixed numbers
function qH(q, mixed = false) {
  if (q.d === 1) return N(q.n);
  const s = q.n < 0 ? MINUS : '', a = Math.abs(q.n);
  if (mixed && a > q.d) return s + Math.floor(a / q.d) + fr(a % q.d, q.d);
  return s + fr(a, q.d);
}
const mixH = (w, n, d) => (w ? w : '') + fr(n, d);

// ---------- surds ----------
// k√m with m square-free
function surd(n) { let k = 1, m = n; for (let f = 2; f * f <= m; f++) while (m % (f * f) === 0) { m /= f * f; k *= f; } return { k, m }; }
const sH = (k, m) => m === 1 ? N(k) : (k === 1 ? '' : k === -1 ? MINUS : N(k)) + rt(m);

// ---------- svg ----------
const f1 = v => Number(v).toFixed(1);
const svg = (w, h, inner, cls = 'fig') => '<svg class="' + cls + '" viewBox="0 0 ' + w + ' ' + h + '" role="img">' + inner + '</svg>';
const sL = (a, b, c = 'ln') => '<line class="' + c + '" x1="' + f1(a[0]) + '" y1="' + f1(a[1]) + '" x2="' + f1(b[0]) + '" y2="' + f1(b[1]) + '"/>';
const sP = (pts, c = 'shape') => '<polygon class="' + c + '" points="' + pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ') + '"/>';
const sPl = (pts, c = 'open') => '<polyline class="' + c + '" points="' + pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ') + '"/>';
const sT = (x, y, s, c = 'lab', a = 'middle') => '<text class="' + c + '" x="' + f1(x) + '" y="' + f1(y) + '" text-anchor="' + a + '" dominant-baseline="middle">' + s + '</text>';
const sC = (c, r, cl = 'open') => '<circle class="' + cl + '" cx="' + f1(c[0]) + '" cy="' + f1(c[1]) + '" r="' + f1(r) + '"/>';
const sDot = (p, cl = 'pt', r = 4) => sC(p, r, cl);
const it = s => '<tspan font-style="italic">' + s + '</tspan>';
const sub2 = (a, b) => [a[0] - b[0], a[1] - b[1]];
const unit = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const cen = ps => [ps.reduce((s, p) => s + p[0], 0) / ps.length, ps.reduce((s, p) => s + p[1], 0) / ps.length];
// maths coordinates (y up) to screen, scaled to fit W × H
function fit(pts, W, H, pad = 40) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = Math.min((W - 2 * pad) / ((x1 - x0) || 1), (H - 2 * pad) / ((y1 - y0) || 1));
  const ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  return pts.map(p => [ox + (p[0] - x0) * s, H - oy - (p[1] - y0) * s]);
}
// a label beside side AB, on the outside (away from G)
function sideLab(A, B, s, G, off = 16, c = 'lab') {
  const m = mid(A, B); let [nx, ny] = unit([-(B[1] - A[1]), B[0] - A[0]]);
  if ((m[0] - G[0]) * nx + (m[1] - G[1]) * ny < 0) { nx = -nx; ny = -ny; }
  return sT(m[0] + nx * off, m[1] + ny * off, s, c);
}
// angle arc at V between rays VA and VB
function angArc(V, A, B, r = 22, c = 'am') {
  const a1 = Math.atan2(A[1] - V[1], A[0] - V[0]), a2 = Math.atan2(B[1] - V[1], B[0] - V[0]);
  let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
  const p1 = [V[0] + r * Math.cos(a1), V[1] + r * Math.sin(a1)], p2 = [V[0] + r * Math.cos(a2), V[1] + r * Math.sin(a2)];
  return '<path class="' + c + '" d="M' + f1(p1[0]) + ' ' + f1(p1[1]) + ' A' + r + ' ' + r + ' 0 0 ' + (d > 0 ? 1 : 0) + ' ' + f1(p2[0]) + ' ' + f1(p2[1]) + '"/>';
}
// label inside the angle at V
function angLab(V, A, B, s, off = 36, c = 'labs') {
  const u = unit(sub2(A, V)), w = unit(sub2(B, V)), b = unit([u[0] + w[0], u[1] + w[1]]);
  return sT(V[0] + b[0] * off, V[1] + b[1] * off, s, c);
}
function rightMark(V, A, B, s = 13) {

// Graph({ x0, x1, y0, y1, W, H, step, lab }) – draw into it, then .svg()
function Graph(o) {
  const W = o.W || 420, H = o.H || 420, step = o.step || 1, ls = o.lab || step, ys = o.ystep || step, yl = o.ylab || ls;
  const sx = x => (x - o.x0) / (o.x1 - o.x0) * W, sy = y => H - (y - o.y0) / (o.y1 - o.y0) * H;
  const under = [], items = [], top = [];
  const near = (v, s) => Math.abs(v / s - Math.round(v / s)) < 1e-6;
  for (let x = Math.ceil(o.x0 / step) * step; x <= o.x1 + 1e-9; x += step) under.push(sL([sx(x), 0], [sx(x), H], 'gl'));
  for (let y = Math.ceil(o.y0 / ys) * ys; y <= o.y1 + 1e-9; y += ys) under.push(sL([0, sy(y)], [W, sy(y)], 'gl'));
  const ax = Math.max(2, Math.min(W - 2, sx(0))), ay = Math.max(2, Math.min(H - 2, sy(0)));
  under.push(sL([0, ay], [W, ay], 'ax'), sL([ax, 0], [ax, H], 'ax'));
  if (!o.nolab) {
    for (let x = Math.ceil(o.x0 / ls) * ls; x <= o.x1 + 1e-9; x += ls) if (Math.abs(x) > 1e-9 && near(x, ls) && sx(x) > 8 && sx(x) < W - 8) under.push(sT(sx(x), Math.min(H - 9, ay + 13), N(x), 'tk'));
    for (let y = Math.ceil(o.y0 / yl) * yl; y <= o.y1 + 1e-9; y += yl) if (Math.abs(y) > 1e-9 && near(y, yl) && sy(y) > 8 && sy(y) < H - 8) under.push(sT(Math.max(12, ax - 7), sy(y), N(y), 'tk', 'end'));
    under.push(sT(W - 8, ay - 12, it(o.xn || 'x'), 'labs'), sT(ax + 12, 10, it(o.yn || 'y'), 'labs'));
  }
  const cid = 'c' + Math.random().toString(36).slice(2);
  const G = {
    W, H, sx, sy,
    p: (x, y) => [sx(x), sy(y)],
    fn(f, cls = 'cf', from = o.x0, to = o.x1, n = 400) {
      let d = '', pen = false;
      for (let i = 0; i <= n; i++) {
        const x = from + (to - from) * i / n, y = f(x);
        if (!isFinite(y) || Math.abs(y) > 1e4) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + f1(sx(x)) + ' ' + f1(Math.max(-H, Math.min(2 * H, sy(y))));
        pen = true;
      }
      items.push('<path class="' + cls + '" d="' + d + '"/>');
      return G;
    },
    seg(x1, y1, x2, y2, cls = 'cf') { items.push(sL([sx(x1), sy(y1)], [sx(x2), sy(y2)], cls)); return G; },
    raw(s) { items.push(s); return G; },
    top(s) { top.push(s); return G; },
    dot(x, y, cls = 'pf', lab = '', dx = 10, dy = -14, lc = 'lab') {
      top.push(sDot([sx(x), sy(y)], cls, 5.5));
      if (lab) top.push(sT(sx(x) + dx, sy(y) + dy, lab, lc, dx < 0 ? 'end' : 'start'));
      return G;
    },
    svg(cls = 'fig') {
      return svg(W, H, '<defs><clipPath id="' + cid + '"><rect width="' + W + '" height="' + H + '"/></clipPath></defs>' + under.join('') +
        '<g clip-path="url(#' + cid + ')">' + items.join('') + '</g>' + top.join(''), cls);
    }
  };

}

(function () {

// worked example with steps revealed one at a time
function Stepper(host) {
  host.innerHTML = '<div class="stepbar"><button class="btn sn">Next step</button><button class="btn sb">Back</button><button class="btn sa">Show all</button><button class="btn sr">Hide all</button></div><div class="steps"></div>';

  const go = k => { n = Math.max(0, Math.min(st.length, k)); draw(); };
  host.querySelector('.sn').onclick = () => go(n + 1);
