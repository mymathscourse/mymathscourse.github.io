<script>
// ===================== Shared helpers (no page code here, so test.js can load it) =====================
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const nz = (a, b) => { let v = 0; while (!v) v = ri(a, b); return v; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const MINUS = '−';
const clean = x => parseFloat(Number(x).toFixed(10));
// a number with a proper minus sign (no float noise)
const N = x => { x = clean(x); return (x < 0 ? MINUS : '') + String(Math.abs(x)); };
// fixed decimal places, trailing zeros kept
const fx = (x, d = 2) => { const s = Math.abs(x).toFixed(d); return (x < 0 && Number(s) !== 0 ? MINUS : '') + s; };
// rounded to d decimal places, trailing zeros dropped
const rd = (x, d = 2) => N(Math.round(x * 10 ** d) / 10 ** d);
// n significant figures, trailing zeros kept (e.g. 2.50)
const sf = (x, n = 3) => {
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x))), d = Math.max(0, n - 1 - e);
  const r = Number(x.toPrecision(n));
  return (r < 0 ? MINUS : '') + Math.abs(r).toFixed(d);
};
// money
const gbp = x => { const r = Math.round(Math.abs(x) * 100) / 100; return '£' + (Number.isInteger(r) ? String(r) : r.toFixed(2)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
const big = x => N(x).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// ---------- maths html ----------
const mm = h => '<span class="mm">' + h + '</span>';
const V = s => '<i>' + s + '</i>';
const X = V('x'), Y = V('y');
const sup = s => '<sup>' + s + '</sup>';
const fr = (t, b) => '<span class="fr"><span>' + t + '</span><span>' + b + '</span></span>';
const rt = s => '√<span class="ov">' + s + '</span>';
const hl = s => '<span class="hl">' + s + '</span>';
const hb = s => '<span class="hb">' + s + '</span>';
const deg = '°';
const pw = (v, p) => p === 0 ? '' : p === 1 ? v : v + sup(p);
// one term c·v, as the first term (sign only if negative) or with " + " / " − " in front
function tm(c, v = '', first = false) {
  if (!c) return '';
  const a = Math.abs(c), body = (a === 1 && v ? '' : N(a)) + v;
  if (first) return (c < 0 ? MINUS : '') + body;
  return (c < 0 ? ' − ' : ' + ') + body;
}
// [[c, v], ...] as an expression, skipping zero terms
function ex(terms) {
  let s = '', first = true;
  for (const [c, v] of terms) { if (!c) continue; s += tm(c, v, first); first = false; }
  return s || '0';
}
// ax + b style helpers
const lin = (a, b, v = X) => ex([[a, v], [b, '']]);
const quad = (a, b, c, v = X) => ex([[a, pw(v, 2)], [b, v], [c, '']]);
// (x + a)
const br = (a, b, v = X) => '(' + lin(a, b, v) + ')';
// signed number for substitution: wraps negatives in brackets
const sb = x => x < 0 ? '(' + N(x) + ')' : N(x);
// " + 3" / " − 3"
const pm = x => (x < 0 ? ' − ' : ' + ') + N(Math.abs(x));
const vec = (...c) => '<span class="vec"><b>(</b><span>' + c.map(v => '<span>' + v + '</span>').join('') + '</span><b>)</b></span>';
const bold = s => '<b>' + s + '</b>';
const arrow = s => '<span style="display:inline-block;position:relative">' + s + '<span style="position:absolute;left:0;right:0;top:-.55em;text-align:center;font-size:.8em">→</span></span>';

// ---------- exact fractions ----------
const Q = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
const qadd = (a, b) => Q(a.n * b.d + b.n * a.d, a.d * b.d);
const qsub = (a, b) => Q(a.n * b.d - b.n * a.d, a.d * b.d);
const qmul = (a, b) => Q(a.n * b.n, a.d * b.d);
const qdiv = (a, b) => Q(a.n * b.d, a.d * b.n);
const qv = q => q.n / q.d;
// html; mixed = true writes improper fractions as mixed numbers
function qH(q, mixed = false) {
  if (q.d === 1) return N(q.n);
  const s = q.n < 0 ? MINUS : '', a = Math.abs(q.n);
  if (mixed && a > q.d) return s + Math.floor(a / q.d) + fr(a % q.d, q.d);
  return s + fr(a, q.d);
}
const mixH = (w, n, d) => (w ? w : '') + fr(n, d);

// ---------- surds ----------
// k√m with m square-free
function surd(n) { let k = 1, m = n; for (let f = 2; f * f <= m; f++) while (m % (f * f) === 0) { m /= f * f; k *= f; } return { k, m }; }
const sH = (k, m) => m === 1 ? N(k) : (k === 1 ? '' : k === -1 ? MINUS : N(k)) + rt(m);

// ---------- svg ----------
const f1 = v => Number(v).toFixed(1);
const svg = (w, h, inner, cls = 'fig') => '<svg class="' + cls + '" viewBox="0 0 ' + w + ' ' + h + '" role="img">' + inner + '</svg>';
const sL = (a, b, c = 'ln') => '<line class="' + c + '" x1="' + f1(a[0]) + '" y1="' + f1(a[1]) + '" x2="' + f1(b[0]) + '" y2="' + f1(b[1]) + '"/>';
const sP = (pts, c = 'shape') => '<polygon class="' + c + '" points="' + pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ') + '"/>';
const sPl = (pts, c = 'open') => '<polyline class="' + c + '" points="' + pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ') + '"/>';
const sT = (x, y, s, c = 'lab', a = 'middle') => '<text class="' + c + '" x="' + f1(x) + '" y="' + f1(y) + '" text-anchor="' + a + '" dominant-baseline="middle">' + s + '</text>';
const sC = (c, r, cl = 'open') => '<circle class="' + cl + '" cx="' + f1(c[0]) + '" cy="' + f1(c[1]) + '" r="' + f1(r) + '"/>';
const sDot = (p, cl = 'pt', r = 4) => sC(p, r, cl);
const it = s => '<tspan font-style="italic">' + s + '</tspan>';
const sub2 = (a, b) => [a[0] - b[0], a[1] - b[1]];
const unit = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const cen = ps => [ps.reduce((s, p) => s + p[0], 0) / ps.length, ps.reduce((s, p) => s + p[1], 0) / ps.length];
// maths coordinates (y up) to screen, scaled to fit W × H
function fit(pts, W, H, pad = 40) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = Math.min((W - 2 * pad) / ((x1 - x0) || 1), (H - 2 * pad) / ((y1 - y0) || 1));
  const ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  return pts.map(p => [ox + (p[0] - x0) * s, H - oy - (p[1] - y0) * s]);
}
// a label beside side AB, on the outside (away from G)
function sideLab(A, B, s, G, off = 16, c = 'lab') {
  const m = mid(A, B); let [nx, ny] = unit([-(B[1] - A[1]), B[0] - A[0]]);
  if ((m[0] - G[0]) * nx + (m[1] - G[1]) * ny < 0) { nx = -nx; ny = -ny; }
  return sT(m[0] + nx * off, m[1] + ny * off, s, c);
}
// angle arc at V between rays VA and VB
function angArc(V, A, B, r = 22, c = 'am') {
  const a1 = Math.atan2(A[1] - V[1], A[0] - V[0]), a2 = Math.atan2(B[1] - V[1], B[0] - V[0]);
  let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
  const p1 = [V[0] + r * Math.cos(a1), V[1] + r * Math.sin(a1)], p2 = [V[0] + r * Math.cos(a2), V[1] + r * Math.sin(a2)];
  return '<path class="' + c + '" d="M' + f1(p1[0]) + ' ' + f1(p1[1]) + ' A' + r + ' ' + r + ' 0 0 ' + (d > 0 ? 1 : 0) + ' ' + f1(p2[0]) + ' ' + f1(p2[1]) + '"/>';
}
// label inside the angle at V
function angLab(V, A, B, s, off = 36, c = 'labs') {
  const u = unit(sub2(A, V)), w = unit(sub2(B, V)), b = unit([u[0] + w[0], u[1] + w[1]]);
  return sT(V[0] + b[0] * off, V[1] + b[1] * off, s, c);
}
function rightMark(V, A, B, s = 13) {

// ---------- coordinate graphs ----------
// Graph({ x0, x1, y0, y1, W, H, step, lab }) – draw into it, then .svg()
function Graph(o) {
  const W = o.W || 420, H = o.H || 420, step = o.step || 1, ls = o.lab || step, ys = o.ystep || step, yl = o.ylab || ls;
  const sx = x => (x - o.x0) / (o.x1 - o.x0) * W, sy = y => H - (y - o.y0) / (o.y1 - o.y0) * H;
  const under = [], items = [], top = [];
  const near = (v, s) => Math.abs(v / s - Math.round(v / s)) < 1e-6;
  for (let x = Math.ceil(o.x0 / step) * step; x <= o.x1 + 1e-9; x += step) under.push(sL([sx(x), 0], [sx(x), H], 'gl'));
  for (let y = Math.ceil(o.y0 / ys) * ys; y <= o.y1 + 1e-9; y += ys) under.push(sL([0, sy(y)], [W, sy(y)], 'gl'));
  const ax = Math.max(2, Math.min(W - 2, sx(0))), ay = Math.max(2, Math.min(H - 2, sy(0)));
  under.push(sL([0, ay], [W, ay], 'ax'), sL([ax, 0], [ax, H], 'ax'));
  if (!o.nolab) {
    for (let x = Math.ceil(o.x0 / ls) * ls; x <= o.x1 + 1e-9; x += ls) if (Math.abs(x) > 1e-9 && near(x, ls) && sx(x) > 8 && sx(x) < W - 8) under.push(sT(sx(x), Math.min(H - 9, ay + 13), N(x), 'tk'));
    for (let y = Math.ceil(o.y0 / yl) * yl; y <= o.y1 + 1e-9; y += yl) if (Math.abs(y) > 1e-9 && near(y, yl) && sy(y) > 8 && sy(y) < H - 8) under.push(sT(Math.max(12, ax - 7), sy(y), N(y), 'tk', 'end'));
    under.push(sT(W - 8, ay - 12, it(o.xn || 'x'), 'labs'), sT(ax + 12, 10, it(o.yn || 'y'), 'labs'));
  }
  const cid = 'c' + Math.random().toString(36).slice(2);
  const G = {
    W, H, sx, sy,
    p: (x, y) => [sx(x), sy(y)],
    fn(f, cls = 'cf', from = o.x0, to = o.x1, n = 400) {
      let d = '', pen = false;
      for (let i = 0; i <= n; i++) {
        const x = from + (to - from) * i / n, y = f(x);
        if (!isFinite(y) || Math.abs(y) > 1e4) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + f1(sx(x)) + ' ' + f1(Math.max(-H, Math.min(2 * H, sy(y))));
        pen = true;
      }
      items.push('<path class="' + cls + '" d="' + d + '"/>');
      return G;
    },
    seg(x1, y1, x2, y2, cls = 'cf') { items.push(sL([sx(x1), sy(y1)], [sx(x2), sy(y2)], cls)); return G; },
    raw(s) { items.push(s); return G; },
    top(s) { top.push(s); return G; },
    dot(x, y, cls = 'pf', lab = '', dx = 10, dy = -14, lc = 'lab') {
      top.push(sDot([sx(x), sy(y)], cls, 5.5));
      if (lab) top.push(sT(sx(x) + dx, sy(y) + dy, lab, lc, dx < 0 ? 'end' : 'start'));
      return G;
    },
    svg(cls = 'fig') {
      return svg(W, H, '<defs><clipPath id="' + cid + '"><rect width="' + W + '" height="' + H + '"/></clipPath></defs>' + under.join('') +
        '<g clip-path="url(#' + cid + ')">' + items.join('') + '</g>' + top.join(''), cls);
    }
  };
  return G;
}

// a step of working: [title, maths html (one line per array item), optional note]
const S = (title, lines, why) => why ? [title, Array.isArray(lines) ? lines : [lines], why] : [title, Array.isArray(lines) ? lines : [lines]];

// Surds, indices and scientific notation
const SQF = [2, 3, 5, 6, 7, 10, 11];
const SQ = [4, 9, 16, 25, 36, 49, 64, 81, 100];
function surdLines(n) {
  const { k, m } = surd(n);
  if (k === 1) return [rt(n) + ' has no square factor, so it is already simplified'];
  return [N(n) + ' = ' + hl(k * k) + ' × ' + m, rt(n) + ' = ' + rt(hl(k * k)) + ' × ' + rt(m), '= ' + sH(k, m)];
}
// n√m / d tidied
function surdFrac(n, m, d) {
  const g = gcd(n, d); n /= g; d /= g;
  if (d < 0) { n = -n; d = -d; }
  return d === 1 ? sH(n, m) : fr(sH(n, m), d);
}
const xp = (p, v = X) => p === 1 ? v : v + sup(typeof p === 'object' ? qH(p) : N(p));
const coefX = (c, p) => p === 0 ? N(c) : (c === 1 ? '' : c === -1 ? MINUS : N(c)) + xp(p);

// ---------- scientific notation ----------
const sci = (m, e) => m + ' × 10' + sup(N(e));
function plain(digits, e) { // digits "345" means 3.45, times 10^e
  const pos = 1 + e;
  let s;
  if (pos >= digits.length) s = digits + '0'.repeat(pos - digits.length);
  else if (pos <= 0) s = '0.' + '0'.repeat(-pos) + digits;
  else s = digits.slice(0, pos) + '.' + digits.slice(pos);
  return s.replace(/^(\d+)/, w => w.replace(/\B(?=(\d{3})+(?!\d))/g, ' '));
}
const mant = d => d.length === 1 ? d : d[0] + '.' + d.slice(1);
function toSci(x, n = 3) {
  let e = Math.floor(Math.log10(Math.abs(x))), m = Number((x / 10 ** e).toPrecision(n));
  if (m >= 10) { m /= 10; e++; }
  return { m: Number(m.toPrecision(n)), e };
}

// ===================== Page: tabs, worked examples, practice questions =====================
// TOPIC = { title, folder, tabs: [tab] }
// tab = { id, name, seq, types: [type], own?, build? }
//   type = { name, g: 'C' | 'A' | 'E', calc: true/false, gen: () => example, demo: false (practice only) }
//   example = { q: html, fig?: svg, steps: [S(title, lines, why)], ans: html }
//   own = { fields: [[key, label, default]], make: values => example (throw a message if they don't work) }
//   build(host) (optional) draws an interactive explorer at the top of the tab; it replaces the worked-example stepper unless examples: true
(function () {
const GRADE = { C: 'C', A: 'A', E: 'Extension' };
const chips = t => '<span class="gr ' + t.g + '">' + GRADE[t.g] + '</span>' + (t.calc == null ? '' : '<span class="calc">' + (t.calc ? 'Calculator' : 'Non-calculator') + '</span>');
const lineH = l => /^\s*<(table|svg|p|div)/.test(l) ? l : '<div class="mm">' + l + '</div>';
function stepsH(ex) {
  const st = ex.steps.slice();
  if (ex.ans) st.push(['Answer', ['<div class="ans">' + ex.ans + '</div>']]);
  return st;
}
const stepH = (s, i, hid) => '<div class="step' + (hid ? ' hid' : '') + '" data-i="' + i + '"><div class="num">' + (i + 1) + '</div><div class="body"><div class="st">' + s[0] + '</div><div class="bd">' +
  s[1].map(lineH).join('') + (s[2] ? '<p class="why">' + s[2] + '</p>' : '') + '</div></div></div>';
function safeGen(t) {
  for (let k = 0; k < 80; k++) { try { const e = t.gen(); if (e) return e; } catch (err) { console.error(err); } }
  return null;
}

// worked example with steps revealed one at a time
function Stepper(host) {
  host.innerHTML = '<div class="stepbar"><button class="btn sn">Next step</button><button class="btn sb">Back</button><button class="btn sa">Show all</button><button class="btn sr">Hide all</button></div><div class="steps"></div>';
  const list = host.querySelector('.steps');
  let st = [], n = 0;
  function draw() { list.innerHTML = st.map((s, i) => stepH(s, i, i >= n)).join(''); }
  const go = k => { n = Math.max(0, Math.min(st.length, k)); draw(); };
  host.querySelector('.sn').onclick = () => go(n + 1);
  host.querySelector('.sb').onclick = () => go(n - 1);
  host.querySelector('.sa').onclick = () => go(st.length);
  host.querySelector('.sr').onclick = () => go(0);
  list.addEventListener('click', e => { const s = e.target.closest('.step.hid'); if (s) go(Number(s.dataset.i) + 1); });
  return { set(ex) { st = stepsH(ex); go(0); }, next: () => go(n + 1), back: () => go(n - 1) };
}

function buildExamples(pane, tab) {
  const types = tab.types.filter(t => t.demo !== false);
  const box = document.createElement('div');
  box.innerHTML = '<div class="bar"><label>Example <select class="typ">' + types.map((t, i) => '<option value="' + i + '">' + t.name + ' (' + GRADE[t.g] + ')</option>').join('') +
    (tab.own ? '<option value="own">Your own…</option>' : '') + '</select></label><button class="btn primary nx">New example</button><span class="chips"></span></div>' +
    '<div class="bar own" hidden></div>' +
    '<div class="cols"><div class="panel"><div class="qtext"></div><div class="figw"></div></div><div class="panel wk"></div></div>';
  pane.appendChild(box);
  const sel = box.querySelector('.typ'), q = box.querySelector('.qtext'), figw = box.querySelector('.figw'), ch = box.querySelector('.chips'), own = box.querySelector('.own');
  const st = Stepper(box.querySelector('.wk'));
  function show(ex, t) {
    q.innerHTML = ex.q; figw.innerHTML = ex.fig || ''; ch.innerHTML = t ? chips(t) : '';
    st.set(ex);
  }
  if (tab.own) {
    own.innerHTML = tab.own.fields.map(([k, lab, d, w]) => '<label>' + lab + ' <input class="n' + (w ? ' w' : '') + '" data-k="' + k + '" value="' + d + '"></label>').join('') +
      '<button class="btn primary go">Show working</button><span class="err"></span>';
    const err = own.querySelector('.err');
    const runOwn = () => {
      const v = {};
      own.querySelectorAll('input').forEach(i => { v[i.dataset.k] = i.value.trim(); });
      try { const e = tab.own.make(v); err.textContent = ''; show(e, null); }
      catch (e) { err.textContent = typeof e === 'string' ? e : 'Those values don’t work here.'; if (typeof e !== 'string') console.error(e); }
    };
    own.querySelector('.go').onclick = runOwn;
    own.addEventListener('keydown', e => { if (e.key === 'Enter') runOwn(); });
  }
  function next() {
    if (sel.value === 'own') { own.querySelector('.go').click(); return; }
    const t = types[Number(sel.value)], e = safeGen(t);
    if (e) show(e, t);
  }
  sel.onchange = () => { own.hidden = sel.value !== 'own'; next(); };
  box.querySelector('.nx').onclick = next;
  if (types.length) next(); else if (tab.own) { sel.value = 'own'; own.hidden = false; next(); }
  return { next, st };
}

// practice questions: pick by level, C → A → extension
function choose(types, level, n) {
  const by = g => shuffle(types.filter(t => t.g === g));
  const take = (pool, k) => { const out = []; for (let i = 0; i < k && pool.length; i++) out.push(pool[i % pool.length]); return out; };
  if (level !== 'mix') return take(by(level), n);
  const c = by('C'), a = by('A'), e = by('E');
  let ne = e.length ? Math.max(1, Math.round(n / 6)) : 0, na = a.length ? Math.max(1, Math.round(n / 3)) : 0, nc = n - ne - na;
  if (!c.length) { na += nc; nc = 0; }
  return [...take(c, nc), ...take(a, na), ...take(e, ne)];
}
function PracticeBox(host, types, title = 'Practice questions', start = 6) {
  const has = g => types.some(t => t.g === g);
  const box = document.createElement('div');
  box.className = 'practice';
  box.innerHTML = '<div class="phead"><h2>' + title + '</h2>' +
    '<label>Level <select class="plev"><option value="mix">Mixed: C, then A, then extension</option>' + ['C', 'A', 'E'].filter(has).map(g => '<option value="' + g + '">' + GRADE[g] + (g === 'E' ? '' : ' only') + '</option>').join('') + '</select></label>' +
    '<label>How many <select class="pcount">' + [2, 4, 6, 8, 10, 12].map(k => '<option' + (k === start ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></label>' +
    '<button class="btn primary pnew">New questions</button><button class="btn pall">Show all solutions</button><button class="btn pprint">Print</button></div><ol class="plist"></ol>';
  host.appendChild(box);
  const list = box.querySelector('.plist'), allB = box.querySelector('.pall');
  function fill() {
    const n = Number(box.querySelector('.pcount').value), plan = choose(types, box.querySelector('.plev').value, n), seen = new Set(), items = [];
    plan.forEach(t => {
      for (let k = 0; k < 25; k++) {
        const e = safeGen(t);
        const key = e && e.q + (e.fig || '') + e.ans;
        if (!e || seen.has(key)) continue;
        seen.add(key); items.push([t, e]); break;
      }
    });
    list.innerHTML = items.length ? items.map(([t, e]) => '<li><div class="pmeta">' + chips(t) + '</div><div class="pq">' + e.q + '</div>' + (e.fig || '') +
      '<button class="btn psol" aria-expanded="false">Show worked solution</button><div class="pws" hidden>' + stepsH(e).map((s, i) => stepH(s, i, false)).join('') + '</div></li>').join('')
      : '<li class="pnone">No questions at this level here.</li>';
    allB.textContent = 'Show all solutions';
  }
  function toggle(b, open) {
    const w = b.nextElementSibling; w.hidden = !open;
    b.textContent = open ? 'Hide worked solution' : 'Show worked solution'; b.setAttribute('aria-expanded', String(open));
  }
  list.addEventListener('click', e => { const b = e.target.closest('.psol'); if (b) toggle(b, b.nextElementSibling.hidden); });
  allB.addEventListener('click', () => {
    const open = allB.textContent.startsWith('Show');
    list.querySelectorAll('.psol').forEach(b => toggle(b, open));
    allB.textContent = open ? 'Hide all solutions' : 'Show all solutions';
  });
  box.querySelector('.pnew').addEventListener('click', fill);
  box.querySelector('.pcount').addEventListener('change', fill);
  box.querySelector('.plev').addEventListener('change', fill);
  box.querySelector('.pprint').addEventListener('click', () => window.print());
  fill();
  return { fill };
}

// ---------- tabs ----------
const TABS = TOPIC.tabs.slice();
const allTypes = [...new Set(TABS.flatMap(t => t.types || []))];
if (TABS.length > 1) TABS.push({ id: 'mixed', name: 'Mixed practice', seq: 'Questions from every tab, C grade first, then A grade, then extension.', mixed: true });
const tabsEl = document.getElementById('tabs'), panesEl = document.getElementById('panes'), seqEl = document.getElementById('seq');
const built = {};
let current = null;
TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.setAttribute('role', 'tab'); b.dataset.tab = t.id;
  b.innerHTML = '<span class="k">' + ((i + 1) % 10) + '</span>' + t.name;
  b.addEventListener('click', () => show(t.id));
  tabsEl.appendChild(b);
  const p = document.createElement('section'); p.id = 'p-' + t.id; p.hidden = true; panesEl.appendChild(p);
});
function show(id) {
  const t = TABS.find(x => x.id === id) || TABS[0];
  current = t.id;
  TABS.forEach(x => { document.getElementById('p-' + x.id).hidden = x.id !== t.id; });
  tabsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t.id)));
  seqEl.textContent = t.seq || '';
  if (!built[t.id]) {
    const pane = document.getElementById('p-' + t.id);
    if (t.mixed) { built[t.id] = {}; PracticeBox(pane, allTypes, 'Mixed practice', 10); }
    else {
      built[t.id] = {};
      if (t.build) { const ex = document.createElement('div'); ex.className = 'explore'; pane.appendChild(ex); built[t.id] = t.build(ex) || {}; }
      if (!t.build || t.examples) Object.assign(built[t.id], buildExamples(pane, t));
      if (t.types && t.types.length) PracticeBox(pane, t.types);
    }
  }
  history.replaceState(null, '', '#' + t.id);
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest('input, select, textarea')) return;
  const k = e.key.toLowerCase(), api = built[current];
  if (/^[0-9]$/.test(k)) { const i = k === '0' ? 9 : Number(k) - 1; if (TABS[i]) show(TABS[i].id); return; }
  if (!api) return;
  if (k === 'w' && api.st) api.st.next();
  else if (k === 'b' && api.st) api.st.back();
  else if (k === 'n' && api.next) api.next();
  else return;
  e.preventDefault();
});
show(location.hash.slice(1) || TABS[0].id);
})();
