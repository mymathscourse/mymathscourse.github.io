  <span class="cnow" data-weeks="[{&quot;start&quot;: &quot;2026-08-10&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Number Work – multiplying and dividing by multiples of 10, 100, 0.1, 0.01&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-number-work.html&quot;, &quot;points&quot;: [&quot;Times tables facts (ongoing learning and review on TTRS)&quot;, &quot;Multiplying whole numbers by ten, one hundred, one thousand, with and then without place value chart (e.g. 44 x 10, 34 x 100)&quot;, &quot;Multiplying decimal numbers by ten with and then without a place value chart. (e.g. 2.9 x 100, 45.7 x 1000)&quot;, &quot;Dividing whole numbers by 10, 100, 1000 with and then without a place value chart (e.g. 72/10, 452/100)&quot;, &quot;Dividing decimal numbers by 10, 100, 1000 with and then without a place value chart (e.g. 7.3 / 10, 45.32/100)&quot;, &quot;Multiplying multiples of 10, 100, 1000 (e.g. 60 x 70)&quot;]}, {&quot;start&quot;: &quot;2026-08-17&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Number work – lattice method multiplying (including with decimals)&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-number-work.html&quot;, &quot;points&quot;: [&quot;Times tables facts (ongoing use of TTRS to build fluency, and strategies to support if fluency is difficult to achieve).&quot;, &quot;Complete lattice multiplication where the grid is drawn and the numbers already placed (e.g. 46 x 7, 38 x 25)&quot;, &quot;Complete lattice multiplication where you have to draw the grid yourself (e.g. 52 x 78)&quot;, &quot;Complete lattice multiplication using decimals (e.g. 3.14 x 18 – familiarity with multiplying by pi is a helpful skill as preparation for circle topics)&quot;, &quot;Use multiplication skills to complete word problem (e.g. S1 are selling cupcakes to raise money for Crossroads. They price their cupcakes at £1.75 and sell 19 – how much money do they make. Ext: calculate the costs of ingredients to make 50 cupcakes using a basic recipe. If cupcakes sell at £1.75, what would the profit be given the costs of the ingredients?)&quot;, &quot;Use multiplication skills to understand patterns (Don Steward worksheets)&quot;]}, {&quot;start&quot;: &quot;2026-08-24&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Number work – estimation and multiplication problems&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-number-work.html&quot;, &quot;points&quot;: [&quot;I can use BODMAS in multi-step calculations (recap from transition)&quot;, &quot;I can estimate an answer before multiplying and use it to check my answer&quot;, &quot;I can solve multi-step word problems, choosing the operations needed&quot;]}, {&quot;start&quot;: &quot;2026-08-31&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Number work – adding and subtracting decimals&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-number-work.html&quot;, &quot;points&quot;: [&quot;I can add and subtract decimals mentally, e.g. 0.6 + 0.7, 5 − 0.35&quot;, &quot;I can add decimals in columns, lining up the decimal point, e.g. 12.6 + 3.85&quot;, &quot;I can subtract decimals with different numbers of decimal places, e.g. 12 − 3.47&quot;, &quot;I can solve money and measurement problems with decimals and check by estimating&quot;]}, {&quot;start&quot;: &quot;2026-09-07&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Number work – bus stop division (including with decimals)&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-number-work.html&quot;, &quot;points&quot;: [&quot;Prior knowledge – bus stop division where there is no remainder, and where the quotient and remainder are both given&quot;, &quot;Times tables facts, fluency in division facts&quot;, &quot;Division using the bus stop method where the answer results in a decimal (using place value counters) (e.g. 698 / 8)&quot;, &quot;Division using the bus stop method where the answer results in a recurring decimal. (e.g. 687 / 9)&quot;, &quot;Division using the bus stop method resulting in a decimal that needs rounding (e.g. 439 / 7)&quot;, &quot;Division word problems, including deciding what to do with a remainder&quot;]}, {&quot;start&quot;: &quot;2026-09-14&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Rounding&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-rounding.html&quot;, &quot;points&quot;: [&quot;Prior knowledge – rounding to the nearest 1, 10, 100, 1000. Ability to use place value charts.&quot;, &quot;Placing decimals on a number line where points are given (e.g. place 1.73 on the number line below)&quot;, &quot;Constructing own number line and placing decimals on it. (e.g. draw your own number line and place 6.23 on it)&quot;, &quot;Rounding to one decimal place using the number line (e.g. place 5.34 on the number line below. By identifying which end it is closest to, round 5.34 to 1 d.p.)&quot;, &quot;Rounding to 1 d.p. without a given number line (e.g. round 83.129 to 1 d.p.)&quot;, &quot;Rounding harder numbers to 1 d.p. (e.g. 67.99 to 1 d.p.)&quot;]}, {&quot;start&quot;: &quot;2026-09-21&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Measurement and Angles – units, converting and angle facts&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-measurement.html&quot;, &quot;points&quot;: [&quot;I can choose sensible units for length, mass and capacity&quot;, &quot;I can read scales on measuring instruments&quot;, &quot;I can convert between metric units (mm, cm, m, km; g, kg; ml, l) by multiplying and dividing by 10, 100, 1000&quot;, &quot;I can solve problems involving mixed units&quot;, &quot;Naming and classifying angles (acute, right, obtuse, straight, reflex)&quot;, &quot;Angles on a straight line add to 180° and angles round a point add to 360°&quot;]}, {&quot;start&quot;: &quot;2026-09-28&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Number work – problem solving and consolidation&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-number-work-problem-solving.html&quot;, &quot;points&quot;: [&quot;I can choose which operations and methods to use in multi-step problems with whole numbers and decimals&quot;, &quot;Mixed non-calculator practice covering the term so far&quot;]}, {&quot;start&quot;: &quot;2026-10-05&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Summary and Assessment&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t1-summary-and-assessment.html&quot;, &quot;points&quot;: []}, {&quot;start&quot;: &quot;2026-10-19&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Integers – Adding and Subtracting Negative Numbers&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-integers.html&quot;, &quot;points&quot;: [&quot;Ordering integers on a number line&quot;, &quot;Subtracting a number crossing zero (e.g. 4 – 9)&quot;, &quot;Subtracting numbers starting below zero (e.g. -3 – 1)&quot;, &quot;Adding to a negative number (e.g. -4 + 9)&quot;, &quot;Subtracting a negative number (e.g. 3 - (-5))&quot;, &quot;Negative numbers in context&quot;]}, {&quot;start&quot;: &quot;2026-10-26&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Integers – multiplying and dividing negative numbers&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-integers.html&quot;, &quot;points&quot;: [&quot;Multiplying and dividing with negative numbers, e.g. −3 × 4, −20 ÷ −5&quot;, &quot;Mixed calculations with negatives, e.g. −2 × 3 + 7&quot;, &quot;Problems in context (temperature changes, bank balances, heights above/below sea level)&quot;]}, {&quot;start&quot;: &quot;2026-11-02&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Area and Perimeter&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-area-and-perimeter.html&quot;, &quot;points&quot;: [&quot;Area of a rectangle&quot;, &quot;Composite areas involving rectangles&quot;, &quot;Area of a triangle&quot;, &quot;Composite areas involving triangles and rectangles&quot;, &quot;Word problems involving area and areas involving decimals, multiples 10, 100, 1000, mixed units&quot;]}, {&quot;start&quot;: &quot;2026-11-09&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Area and Perimeter&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-area-and-perimeter.html&quot;, &quot;points&quot;: [&quot;Perimeter of shapes&quot;, &quot;Perimeter of shapes where missing sides need to be calculated&quot;, &quot;Rich tasks with mix of area and perimeter&quot;]}, {&quot;start&quot;: &quot;2026-11-16&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Coordinates – reading plotted coordinates and plotting given points.&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-coordinates.html&quot;, &quot;points&quot;: [&quot;Reading coordinates in one quadrant&quot;, &quot;Reading coordinates in all four quadrants&quot;, &quot;Reading coordinates where increments are fractional or decimal&quot;, &quot;Translations, reflections and rotations&quot;, &quot;Drawing lines of symmetry and completing symmetrical shapes on a grid&quot;]}, {&quot;start&quot;: &quot;2026-11-23&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Algebra – collecting like terms, simplifying expressions and substituting.&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-algebra.html&quot;, &quot;points&quot;: [&quot;I can use a letter to stand for an unknown number and write simple expressions (e.g. \&quot;5 more than n\&quot;)&quot;, &quot;I can collect like terms, e.g. 3a + 2b + 5a − b&quot;, &quot;I can collect like terms including x and x², e.g. 2x² + 3x − x² + 4&quot;]}, {&quot;start&quot;: &quot;2026-11-30&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Algebra – collecting like terms, simplifying expressions and substituting.&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-algebra.html&quot;, &quot;points&quot;: [&quot;I can simplify products, e.g. 3 × 2a, 4a × 5b, a × a&quot;, &quot;I can substitute positive whole numbers into expressions, e.g. find 3a + 2b when a = 4, b = 5&quot;, &quot;I can substitute negative numbers and evaluate formulae in words and in symbols&quot;]}, {&quot;start&quot;: &quot;2026-12-07&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Algebra – collecting like terms, simplifying expressions and substituting.&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-algebra.html&quot;, &quot;points&quot;: [&quot;I can write and simplify expressions for perimeters of shapes&quot;, &quot;I can solve algebra problems and puzzles (e.g. algebra pyramids, magic squares)&quot;]}, {&quot;start&quot;: &quot;2026-12-14&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Summary and Assessment&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t2-summary-and-assessment.html&quot;, &quot;points&quot;: []}, {&quot;start&quot;: &quot;2027-01-04&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Fractions, Decimals, Percentages&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-fractions-decimals-percentages.html&quot;, &quot;points&quot;: [&quot;I know that a fraction is a way of expressing a number which isn&#x27;t a whole number.&quot;, &quot;I know that a fraction is a way of expressing &#x27;how many out of a total of.....&#x27;&quot;, &quot;I can simplify fractions and create equivalent fractions.&quot;, &quot;I understand that fractions, decimals and percentages are ways of expressing the same quantity in different forms. (e.g. how do we write ¼ as a decimal and a percentage?)&quot;, &quot;I know by heart common equivalent fractions (those that appear on handout)&quot;, &quot;I can calculate FDP equivalences such as &#x27;write 3/20 as a percentage and as a decimal&#x27;&quot;]}, {&quot;start&quot;: &quot;2027-01-11&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Fractions, Decimals, Percentages&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-fractions-decimals-percentages.html&quot;, &quot;points&quot;: [&quot;I can find 50%, 25%, 10%, 5% and 1% without a calculator and build other percentages from them&quot;, &quot;I can work out a percentage of an amount (both calculator and non-calculator) (e.g. find 20% of £450, find 7% of 890kg)&quot;, &quot;I can increase an amount by a given percentage (e.g. increase $40 by 20%)&quot;, &quot;I can decrease an amount by a given percentage (e.g. 15% off in a sale)&quot;]}, {&quot;start&quot;: &quot;2027-01-18&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Fractions, Decimals, Percentages&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-fractions-decimals-percentages.html&quot;, &quot;points&quot;: [&quot;I can work out a unitary fraction of an amount (e.g. find 1/5 of 45)&quot;, &quot;I can work out a non-unitary fraction of an amount (e.g. find 2/7 of 49)&quot;, &quot;I can use my knowledge of fractions, decimals and percentages to solve problems in a real life context (e.g. a plank of wood is 128cm long. A carpenter cuts 3/8 off. What is the length of the plank now?)&quot;, &quot;I can compare offers to make an informed choice (e.g. 3 for the price of 2 or 30% off?)&quot;]}, {&quot;start&quot;: &quot;2027-01-25&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Ratio&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-ratio.html&quot;, &quot;points&quot;: [&quot;I understand the concept of sharing evenly. I can perform calculations without a calculator (e.g. Share £42 evenly between 6 people) and with a calculator (e.g. A jug has a capacity of 5430ml. If a cup has a volume of 230ml, how many cups can be filled with one jug?)&quot;, &quot;I know that ratio is a way of expressing sharing unevenly.&quot;, &quot;I can simplify ratios and can identify that this is similar to simplifying fractions (e.g. simplify the ratio 4:12, simplify the ratio 6:36:60)&quot;, &quot;I can share in a ratio of two parts (e.g. share 55kg in the ratio 4:7)&quot;, &quot;I can share in a ratio of three parts (e.g. share £70 in the ratio 1:2:4)&quot;, &quot;I can carry out ratio calculations in a context (e.g. the ratio of sheep: cows is 4:7. If there are 20 cows, how many sheep are there?)&quot;]}, {&quot;start&quot;: &quot;2027-02-01&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Ratio&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-ratio.html&quot;, &quot;points&quot;: [&quot;I can link ratios and fractions (e.g. in the ratio 2:3 the first part is 2/5 of the whole)&quot;, &quot;I can use direct proportion and the unitary method (e.g. scaling a recipe for 4 people up to 6)&quot;, &quot;I can find the best buy by comparing unit prices&quot;]}, {&quot;start&quot;: &quot;2027-02-08&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Volume&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-volume.html&quot;, &quot;points&quot;: [&quot;I can find volume by counting cubes and understand cm³ and m³&quot;, &quot;I can calculate the volume of a cube and cuboid using V = l × b × h&quot;, &quot;I can convert between cm³, ml and litres (1 cm³ = 1 ml, 1000 cm³ = 1 litre)&quot;, &quot;I can find a missing dimension when given the volume&quot;]}, {&quot;start&quot;: &quot;2027-02-22&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Volume&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-volume.html&quot;, &quot;points&quot;: [&quot;I can find the volume of composite shapes made from cuboids&quot;, &quot;I can find the volume of a triangular prism (area of cross-section × length)&quot;, &quot;I can solve practical problems (e.g. how many boxes fit in a container? how long to fill a tank?)&quot;]}, {&quot;start&quot;: &quot;2027-03-01&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Circle 1 (including rounding)&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-circle.html&quot;, &quot;points&quot;: [&quot;Prerequisite knowledge&quot;, &quot;I can round to 1, 2 and 3 decimal places.&quot;, &quot;I can use an appropriate strategy to multiply numbers involving decimals.&quot;, &quot;I can use appropriate units for lengths.&quot;, &quot;Circle Work&quot;, &quot;I can label the chord, radius, diameter and circumference on a diagram of a circle.&quot;]}, {&quot;start&quot;: &quot;2027-03-08&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Circle 2&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-circle.html&quot;, &quot;points&quot;: [&quot;I can calculate the area of a circle using A = πr²&quot;, &quot;I can find the area of semicircles, quarter circles and composite shapes involving circles&quot;, &quot;I can work backwards to find the diameter from the circumference&quot;, &quot;I can solve problems in context (e.g. which pizza is better value?)&quot;]}, {&quot;start&quot;: &quot;2027-03-15&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Money&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-money.html&quot;, &quot;points&quot;: [&quot;Prerequisite knowledge&quot;, &quot;I can use multiplying relationships and apply these to tables to find missing numbers.&quot;, &quot;I can multiply decimals (using the lattice method or another strategy)&quot;, &quot;I can round numbers to 1, 2 and 3 decimal places.&quot;, &quot;I can calculate percentage increases.&quot;, &quot;Money&quot;]}, {&quot;start&quot;: &quot;2027-03-22&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Money&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-money.html&quot;, &quot;points&quot;: [&quot;I can compare contracts and services (e.g. mobile phones, streaming) and explain which is best value for me&quot;, &quot;I can plan a budget for an event or trip, using a spreadsheet&quot;, &quot;I can calculate profit and loss&quot;]}, {&quot;start&quot;: &quot;2027-03-29&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Summary and Assessment&quot;, &quot;href&quot;: &quot;./s1/topics/S1-t3-summary-and-assessment.html&quot;, &quot;points&quot;: []}, {&quot;start&quot;: &quot;2027-04-12&quot;, &quot;note&quot;: &quot;&quot;, &quot;title&quot;: &quot;Further fractions&quot;, &quot;href&
